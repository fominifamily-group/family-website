<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{

font-family:Arial;

background:#f2f2f2;

margin:0;

padding:0;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

}

.chat-container{

width:95%;

max-width:700px;

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 0 10px rgba(0,0,0,0.1);

}

h1{

text-align:center;

margin-bottom:20px;

}

.chat-box{

height:400px;

overflow-y:auto;

padding:10px;

background:#ffffff;

border:1px solid #ccc;

border-radius:10px;

margin-bottom:15px;

}

.message{

background:#f2f2f2;

padding:12px;

margin:10px 0;

border-radius:10px;

text-align:left;

font-size:18px;

line-height:1.5;

word-break:break-word;

overflow-wrap:anywhere;

white-space:normal;

}

.chat-input{

display:flex;

gap:10px;

width:100%;

}

#message{

flex:1;

padding:15px;

font-size:18px;

border-radius:10px;

border:1px solid gray;

outline:none;

box-sizing:border-box;

min-width:0;

}


#send-btn{

padding:15px 20px;

font-size:18px;

border:none;

border-radius:10px;

background:#007bff;

color:white;

cursor:pointer;

white-space:nowrap;

}

#logout-btn{

padding:10px 15px;

margin-bottom:15px;

border:none;

border-radius:8px;

background:red;

color:white;

cursor:pointer;

}

@media screen and (max-width:600px){

.chat-container{

width:100%;

height:100vh;

border-radius:0;

padding:10px;

box-sizing:border-box;

}

.chat-box{

height:60vh;

}

#message{

font-size:18px;

padding:18px;

}

#send-btn{

padding:15px;

font-size:16px;

}

.message{

font-size:18px;

}

}

</style>
<head>

<style>

body{

text-align:center;

font-family:Arial;

}

#logout-btn{

padding:10px 20px;

margin-top:10px;

}

</style>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Family Chat</title>


<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="chat-container">

    <h1>Family Chat Room</h1>
    <button id="logout-btn">

Logout

</button>

    <div class="chat-box" id="chat-box">


</div>


<div class="chat-input">

<input type="text"
id="message"
placeholder="Type your message here...">

<button id="send-btn">
Send
</button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
deleteDoc,
doc


} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDDqCkLKD_zwYD4ffhgTxk9qQtXTyUTSXE",

authDomain: "family-chat-4ae3c.firebaseapp.com",

projectId: "family-chat-4ae3c",

storageBucket: "family-chat-4ae3c.firebasestorage.app",

messagingSenderId: "757400177632",

appId: "1:757400177632:web:3b1743038b3c4a53c3985"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = "";

onAuthStateChanged(auth, (user) => {

if(user){

currentUser = user.displayName;

}

else{

window.location.href = "login.html";

}

});

window.addEventListener("beforeunload", async () => {

await signOut(auth);

});



const sendBtn = document.getElementById("send-btn");

const messageInput = document.getElementById("message");

const chatBox = document.getElementById("chat-box");

sendBtn.addEventListener("click", async () => {

const text = messageInput.value;

if(text.trim() === "") return;

await addDoc(collection(db, "messages"), {

  name: currentUser,

text: text,

photo: "https://i.pravatar.cc/150?img",

time: Date.now()

});

messageInput.value = "";

});

const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {

chatBox.innerHTML = "";

snapshot.docs.forEach((doc) => {

const data = doc.data();

chatBox.innerHTML += `
<div class="message">

<div style="display:flex;
align-items:flex-start;
gap:10px;">

<img src="${data.photo}"

width="50"

height="50"

style="border-radius:50%;">

<div>

<p>

<strong>${data.name}</strong>

</p>

<p>

${data.text}

</p>
<button onclick="deleteMessage('${doc.id}')">

Delete

</button>
</div>

</div>

</div>
`;

});

});
async function deleteMessage(id) {

await deleteDoc(doc(db, "messages", id));

}
window.deleteMessage = deleteMessage;
const logoutBtn = document.getElementById("logout-btn");

logoutBtn.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});


window.deleteMessage = async function(id){

await deleteDoc(doc(db, "messages", id));



}
</script>
</body>

</html>
