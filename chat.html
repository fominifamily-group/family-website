<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{

margin:0;

font-family:Arial, sans-serif;

background:#e5ddd5;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

overflow:hidden;

}

.chat-container{

width:100%;

max-width:700px;

height:100vh;

background:#efeae2;

display:flex;

flex-direction:column;

}

h1{

background:#075e54;

color:white;

padding:15px;

margin:0;

font-size:20px;

text-align:center;

}

#logout-btn{

padding:10px 20px;

margin:10px auto;

border:none;

background:#ff4d4d;

color:white;

border-radius:8px;

cursor:pointer;

}

.chat-box{

flex:1;

overflow-y:auto;

padding:15px;

display:flex;

flex-direction:column;

gap:10px;

background:#e5ddd5;

}

.my-message{

display:flex;

justify-content:flex-end;

width:100%;

}

.other-message{

display:flex;

justify-content:flex-start;

width:100%;

}

.message{

padding:10px;

border-radius:10px;

max-width:75%;

word-break:break-word;

box-shadow:0 1px 1px rgba(0,0,0,0.1);

margin-bottom:10px;

}

.my-message .message{

background:#dcf8c6;

}

.other-message .message{

background:white;

}

.message strong{

display:block;

margin-bottom:5px;

color:#075e54;

font-size:14px;

}

.message img{

max-width:100%;

border-radius:10px;

margin-top:10px;

}

.message button{

margin-top:8px;

padding:5px 10px;

border:none;

background:#ff4d4d;

color:white;

border-radius:5px;

cursor:pointer;

font-size:12px;

}

.chat-input{

display:flex;

flex-wrap:wrap;

align-items:center;

padding:8px;

background:#f0f0f0;

gap:8px;

width:100%;

box-sizing:border-box;

}

#message{

flex:1;

padding:12px;

border:none;

border-radius:25px;

font-size:16px;

outline:none;

min-width:0;

}

#image-input{

width:100%;

font-size:12px;

}

#send-btn{

background:#075e54;

color:white;

border:none;

padding:12px;

border-radius:25px;

cursor:pointer;

font-size:14px;

width:100%;

box-sizing:border-box;

}



@media screen and (max-width:600px){

.chat-input{

flex-direction:column;

align-items:stretch;

}

#message{

width:100%;

}

#send-btn{

width:50%;
margin-top: 3px;

}

#image-input{

width:100%;

}

.message{

max-width:90%;

}

}

</style>
<body>

<div class="chat-container">

    <h1>Family Chat Room</h1>
<p id="status"

style="text-align:center; color:green; margin:5px; font-weight:bold;">

🟢 Online

</p>

<p id="typing-status"

style="text-align:center; color:gray; font-size:14px; margin:5px;">

</p>
    <button id="logout-btn">

Logout

</button>

    <div class="chat-box" id="chat-box">


</div>

<div id="reply-preview"

style="display:none; background:#ddd; padding:8px; font-size:14px;">

Replying to:

<span id="reply-text"></span>

<button onclick="cancelReply()"

style="float:right;">

X

</button>

</div>


<div class="chat-input">

<input type="text"
id="message"
placeholder="Type your message here...">

<input type="file" id="image-input">


<button id="record-btn">
🎤
</button>

<button id="send-btn">
Send
</button>

</div>
<script type="module">

  let profilephoto ="";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
deleteDoc,
doc,
updateDoc,


} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDDqCkLKD_zwYD4ffhgTxk9qQtXTyUTSXE",

authDomain: "family-chat-4ae3c.firebaseapp.com",

projectId: "family-chat-4ae3c",

storageBucket: "family-chat-4ae3c.firebasestorage.app",

messagingSenderId: "757400177632",

appId: "1:757400177632:web:3b1743038b3c4a53c3985"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = "";

let replyingTo = "";

onAuthStateChanged(auth, (user) => {

if(user){
  document.getElementById("status").innerHTML = "🟢 Online";

currentUser = user.displayName;

}

else{

window.location.href = "login.html";

}

});

window.addEventListener("beforeunload", async () => {
  document.getElementById("status").innerHTML = "🔴 Offline";

await signOut(auth);

});



const sendBtn = document.getElementById("send-btn");

const recordBtn = document.getElementById("record-btn");

const messageInput = document.getElementById("message");

const typingStatus = document.getElementById("typing-status");


messageInput.addEventListener("input", () => {

typingStatus.innerHTML = `${currentUser} is typing...`;

clearTimeout(window.typingTimer);

window.typingTimer = setTimeout(() => {

typingStatus.innerHTML = "";

}, 1000);

});



const imageInput = document.getElementById("image-input");

const chatBox = document.getElementById("chat-box");

sendBtn.addEventListener("click", async () => {

const text = messageInput.value;

const file = imageInput.files[0];

let imageUrl = "";

if(file){

const formData = new FormData();

formData.append("file", file);

formData.append("upload_preset", "familychat");

const response = await fetch(

"https://api.cloudinary.com/v1_1/dhw5p0mov/image/upload",

{

method: "POST",

body: formData

}

);

const data = await response.json();

imageUrl = data.secure_url;

}

await addDoc(collection(db, "messages"), {

name: currentUser,

text: text,

photo: profilePreview.src,

image: imageUrl,

time: Date.now()

});

replyingTo = "";

document.getElementById("reply-preview").style.display = "none";

messageInput.value = "";

imageInput.value = "";

}); 

let mediaRecorder;

let audioChunks = [];
let isRecording = false;

recordBtn.addEventListener("click", async () => {

if(!isRecording){

const stream = await navigator.mediaDevices.getUserMedia({

audio:true

});

mediaRecorder = new MediaRecorder(stream);

mediaRecorder.start();

audioChunks = [];

isRecording = true;

recordBtn.innerHTML = "⏹️";

mediaRecorder.addEventListener("dataavailable", event => {

audioChunks.push(event.data);

});

mediaRecorder.addEventListener("stop", async () => {

const audioBlob = new Blob(audioChunks, {

type:'audio/webm'

});

const formData = new FormData();

formData.append("file", audioBlob);

formData.append("upload_preset", "familychat");

formData.append("resource_type", "video");

const response = await fetch(

"https://api.cloudinary.com/v1_1/dhw5p0mov/video/upload",

{

method:"POST",

body:formData

}

);

const data = await response.json();


await addDoc(collection(db, "messages"), {

name: currentUser,

text:text,

photo: profilephoto || "https://i.pravata.cc/150?img=3",

image:imageUrl,

time: Date.now(),

seen: false,

reply: replyingTo,


});

});

}

else{

mediaRecorder.stop();

isRecording = false;

recordBtn.innerHTML = "🎤";

}

});

const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {

chatBox.innerHTML = "";

snapshot.docs.forEach((docItem) => {

const data = docItem.data();

if(data.name !== currentUser && !data.seen){

updateDoc(docItem.ref, {

seen:true

});

}

chatBox.innerHTML += `

<div class="${data.name === currentUser ? 'my-message' : 'other-message'}">

<div class="message">

<div style="display:flex; gap:10px; align-items:flex-start;">

<img 
src="${data.photo || 'https://i.pravatar.cc/40'}"
width="40"
height="40"
style="border-radius:50%; object-fit:cover;">

<div>

<strong>${data.name || "User"}</strong>

${data.reply ? `

<div style="
background:#ddd;
padding:5px;
border-left:4px solid #075e54;
margin-bottom:5px;
border-radius:5px;
font-size:13px;
">

<strong>${data.reply.name}</strong><br>

${data.reply.text}

</div>

` : ""}

<p>${data.text || ""}</p>

<small style="color:gray; font-size:11px;">

${new Date(data.time).toLocaleTimeString([], {

hour:'2-digit',
minute:'2-digit'

})}

</small>

<br>

<span style="
color:${data.seen ? 'blue' : 'gray'};
font-size:12px;
font-weight:bold;
">

${data.seen ? '✓✓ Seen' : '✓ Sent'}

</span>

${data.image ? `

<img 
src="${data.image}"
style="
max-width:200px;
border-radius:10px;
margin-top:10px;
">

` : ""}

${data.audio ? `

<audio controls style="margin-top:10px; width:100%;">

<source src="${data.audio}" type="audio/webm">

</audio>

` : ""}

<p style="font-size:18px; margin-top:5px;">

${data.reaction || ""}

</p>

<select onchange="reactMessage('${docItem.id}', this.value)">

<option value="">😀 React</option>
<option value="👍">👍</option>
<option value="❤️">❤️</option>
<option value="😂">😂</option>
<option value="🔥">🔥</option>

</select>

<button onclick="setReply('${data.name}','${data.text || "Voice message"}')">

Reply

</button>

<button onclick="deleteMessage('${docItem.id}')">

Delete

</button>

</div>

</div>

</div>

</div>

`;

});

});

async function deleteMessage(id) {

await deleteDoc(doc(db, "messages", id));

}
window.deleteMessage = deleteMessage;
const logoutBtn = document.getElementById("logout-btn");
function setReply(name, text){

replyingTo = {

name:name,

text:text

};

document.getElementById("reply-preview").style.display = "block";

document.getElementById("reply-text").innerHTML = text;

}

window.setReply = setReply;

function cancelReply(){

replyingTo = "";

document.getElementById("reply-preview").style.display = "none";

}

window.cancelReply = cancelReply;

async function reactMessage(id, emoji){

await updateDoc(doc(db, "messages", id), {

reaction: emoji

});

}

window.reactMessage = reactMessage;

logoutBtn.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});


window.deleteMessage = async function(id){

await deleteDoc(doc(db, "messages", id));



}
</script>
</body>

</html>
