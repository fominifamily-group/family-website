<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{

margin:0;

font-family:Arial, sans-serif;

background:#e5ddd5;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.chat-container{

width:100%;

max-width:700px;

height:100vh;

background:#efeae2;

display:flex;

flex-direction:column;

}

h1{

background:#075e54;

color:white;

padding:15px;

margin:0;

font-size:20px;

text-align:center;

}

.chat-box{

flex:1;

overflow-y:auto;

padding:15px;

display:flex;

flex-direction:column;

gap:10px;

background:#e5ddd5;

}

.message{

background:white;

padding:10px 14px;

border-radius:10px;

max-width:75%;

font-size:16px;

line-height:1.4;

word-break:break-word;

position:relative;

box-shadow:0 1px 1px rgba(0,0,0,0.1);

}

.message strong{

display:block;

margin-bottom:5px;

color:#075e54;

font-size:14px;

}

.message img{

max-width:100%;

border-radius:10px;

margin-top:10px;

}

.message button{

margin-top:8px;

padding:5px 10px;

border:none;

background:#ff4d4d;

color:white;

border-radius:5px;

cursor:pointer;

font-size:12px;

}
.chat-input{

display:flex;

flex-wrap:wrap;

align-items:center;

padding:8px;

background:#f0f0f0;

gap:8px;

width:100%;

box-sizing:border-box;

}







#message{

flex:1;

padding:12px;

border:none;

border-radius:25px;

font-size:16px;

outline:none;

}

#image-input{

max-width:100px;

font-size:12px;

}

#send-btn{

background:#075e54;

color:white;

border:none;

padding:12px 16px;

border-radius:50%;

cursor:pointer;

font-size:14px;

}

#send-btn:hover{

background:#0b806f;

}

/* MOBILE */

@media screen and (max-width:600px){

.chat-container{

height:100vh;

width:100%;

}

.message{

max-width:85%;

font-size:15px;

}

#message{

font-size:16px;

padding:12px;

}

#send-btn{

padding:10px 14px;

}

#image-input{

max-width:70px;

font-size:10px;
.chat-input{

flex-direction:column;

align-items:stretch;

}

#message{

width:100%;

}

#send-btn{

width:100%;

border-radius:10px;

}

#image-input{

width:100%;

}

}

}


</style>
<head>

<style>

body{

text-align:center;

font-family:Arial;

}

#logout-btn{

padding:10px 20px;

margin-top:10px;

}

</style>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Family Chat</title>


<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="chat-container">

    <h1>Family Chat Room</h1>
    <button id="logout-btn">

Logout

</button>

    <div class="chat-box" id="chat-box">


</div>


<div class="chat-input">

<input type="text"
id="message"
placeholder="Type your message here...">

<input type="file" id="image-input">


<button id="send-btn">
Send
</button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
deleteDoc,
doc


} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDDqCkLKD_zwYD4ffhgTxk9qQtXTyUTSXE",

authDomain: "family-chat-4ae3c.firebaseapp.com",

projectId: "family-chat-4ae3c",

storageBucket: "family-chat-4ae3c.firebasestorage.app",

messagingSenderId: "757400177632",

appId: "1:757400177632:web:3b1743038b3c4a53c3985"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = "";

onAuthStateChanged(auth, (user) => {

if(user){

currentUser = user.displayName;

}

else{

window.location.href = "login.html";

}

});

window.addEventListener("beforeunload", async () => {

await signOut(auth);

});



const sendBtn = document.getElementById("send-btn");

const messageInput = document.getElementById("message");

const imageInput = document.getElementById("image-input");

const chatBox = document.getElementById("chat-box");

sendBtn.addEventListener("click", async () => {

const text = messageInput.value;

const file = imageInput.files[0];

let imageUrl = "";

if(file){

const formData = new FormData();

formData.append("file", file);

formData.append("upload_preset", "familychat");

const response = await fetch(

"https://api.cloudinary.com/v1_1/dhw5p0mov/image/upload",

{

method: "POST",

body: formData

}

);

const data = await response.json();

imageUrl = data.secure_url;

}

await addDoc(collection(db, "messages"), {

name: currentUser,

text: text,

photo: "https://i.pravatar.cc/150?img=3",

image: imageUrl,

time: Date.now()

});

messageInput.value = "";

imageInput.value = "";

}); 

const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {

chatBox.innerHTML = "";

snapshot.docs.forEach((doc) => {

const data = doc.data();

chatBox.innerHTML += `
<div class="message">

<div style="display:flex;
align-items:flex-start;
gap:10px;">

<img src="${data.photo}"

width="50"

height="50"

style="border-radius:50%;">

<div>

<p>

<strong>${data.name}</strong>

</p>

<p>

${data.text}

${data.image ? `

<img src="${data.image}"

style="width:200px;
margin-top:10px;
border-radius:10px;">

` : ""}
</p>
<button onclick="deleteMessage('${doc.id}')">

Delete

</button>
</div>

</div>

</div>
`;

});

});
async function deleteMessage(id) {

await deleteDoc(doc(db, "messages", id));

}
window.deleteMessage = deleteMessage;
const logoutBtn = document.getElementById("logout-btn");

logoutBtn.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});


window.deleteMessage = async function(id){

await deleteDoc(doc(db, "messages", id));



}
</script>
</body>

</html>
