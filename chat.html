<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{

display:flex;

justify-content:center;

align-items:center;

height:100vh;

flex-direction:column;

font-family:Arial;

background:#f2f2f2;

margin:0;

}

input{

width:80%;

max-width:300px;

padding:15px;

margin:10px;

font-size:18px;

border-radius:8px;

border:1px solid gray;

}

button{

width:85%;

max-width:320px;

padding:15px;

font-size:18px;

border:none;

border-radius:8px;

background:#007bff;

color:white;

cursor:pointer;

}

h1{

text-align:center;

}
#message{

width:75%;

padding:15px;

font-size:18px;

border-radius:10px;

border:1px solid gray;

}
#send-btn{

padding:15px 20px;

font-size:18px;

border-radius:10px;

margin-left:5px;

}

</style>
<head>

<style>

body{

text-align:center;

font-family:Arial;

}

#logout-btn{

padding:10px 20px;

margin-top:10px;

}

</style>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Family Chat</title>
<button id="delete-selected">

Delete Selected
</button>
<button id="logout-btn">
Logout
</button>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="chat-container">

    <h1>Family Chat Room</h1>

    <div class="chat-box" id="chat-box">

        <div class="message"

onclick="selectMessage('${doc.id}')">
            Welcome to the family chat 👋
        </div>

    </div>


<div class="chat-input">

<input type="text"
id="message"
placeholder="Type your message here...">

<button id="send-btn">
Send
</button>

</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
query,
orderBy,
onSnapshot,
deleteDoc,
doc


} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {

getAuth,
onAuthStateChanged,
signOut

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDDqCkLKD_zwYD4ffhgTxk9qQtXTyUTSXE",

authDomain: "family-chat-4ae3c.firebaseapp.com",

projectId: "family-chat-4ae3c",

storageBucket: "family-chat-4ae3c.firebasestorage.app",

messagingSenderId: "757400177632",

appId: "1:757400177632:web:3b1743038b3c4a53c3985"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

let currentUser = "";
let selectedMessage = "";
onAuthStateChanged(auth, (user) => {

if(user){

currentUser = user.displayName;

}

else{

window.location.href = "login.html";

}

});

window.addEventListener("beforeunload", async () => {

await signOut(auth);

});



const sendBtn = document.getElementById("send-btn");

const messageInput = document.getElementById("message");

const chatBox = document.getElementById("chat-box");

sendBtn.addEventListener("click", async () => {

const text = messageInput.value;

if(text.trim() === "") return;

await addDoc(collection(db, "messages"), {

  name: currentUser,

text: text,

time: Date.now()

});

messageInput.value = "";

});

const q = query(collection(db, "messages"), orderBy("time"));

onSnapshot(q, (snapshot) => {

chatBox.innerHTML = "";

snapshot.forEach((doc) => {

const data = doc.data();

chatBox.innerHTML += `
<div class="message">

<p><strong>${data.name || "Gregory"}</strong></p>

<p>${data.text}</p>


</div>
`;

});

});
async function deleteMessage(id) {

await deleteDoc(doc(db, "messages", id));

}
window.deleteMessage = deleteMessage;
const logoutBtn = document.getElementById("logout-btn");

logoutBtn.addEventListener("click", async () => {

await signOut(auth);

window.location.href = "login.html";

});
window.selectMessage = function(id){

selectedMessage = id;

console.log(selectedMessage);

}


document.getElementById("delete-selected")

.addEventListener("click", async () => {

if(selectedMessage){

try{

await deleteDoc(doc(db, "messages", selectedMessage));

selectedMessage = "";

console.log("Deleted");

alert("Message deleted");

}

catch(error){

console.log(error);

}

}

});

</script>
</body>

</html>
