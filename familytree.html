<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Family Tree</title>

    <link rel="stylesheet" href="style.css">

</head>


    <body>

<div class="tree-container">

<h1>The Fomini Family Tree</h1>

<a href="home.html" class="back-btn">
Back Home
</a>

<div id="family-tree"></div>

</div>

</div>

</div>

</div>

</div>

</div>
</div>

</div>

</div>
<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
collection,
getDocs,
deleteDoc,
doc,
updateDoc

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDDqCkLKD_zwYD4ffhgTxk9qQtXTyUTSXE",

authDomain: "family-chat-4ae3c.firebaseapp.com",

projectId: "family-chat-4ae3c",

storageBucket: "family-chat-4ae3c.firebasestorage.app",

messagingSenderId: "757400177632",

appId: "1:757400177632:web:3b1743038b3c4a53c3985"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const familyTree = document.getElementById("family-tree");

async function loadFamilyMembers(){

const snapshot = await getDocs(collection(db, "familyMembers"));

const groupedFamilies = {};

snapshot.forEach((doc) => {

const data = doc.data();

if(!groupedFamilies[data.family]){

groupedFamilies[data.family] = [];

}

groupedFamilies[data.family].push({

id: doc.id,

...data

});

});

familyTree.innerHTML = "";

for(const familyName in groupedFamilies){

familyTree.innerHTML += `

<div class="family-group">

<h2 class="family-title">

${familyName}

</h2>

<div class="children">

${groupedFamilies[familyName].map(member => `

<div class="member child">

<img src="${member.photo}">

<h2>${member.name}</h2>

<p>${member.role}</p>

<button onclick="deleteMember('${member.id}')">

Delete

</button>

<button onclick="editMember(
'${member.id}',
'${member.name}',
'${member.role}',
'${member.family}'
)">

Edit

</button>
</div>

</div>

`).join("")}

</div>

</div>

`;

}

}

loadFamilyMembers();
window.deleteMember = async function(id){

    window.editMember = async function(id, oldName, oldRole, oldFamily){

const newName = prompt("Edit Name", oldName);

if(newName === null) return;

const newRole = prompt("Edit Role", oldRole);

if(newRole === null) return;

const newFamily = prompt("Edit Family", oldFamily);

if(newFamily === null) return;

await updateDoc(doc(db, "familyMembers", id), {

name:newName,

role:newRole,

family:newFamily

});

alert("Member updated!");

location.reload();

}

await deleteDoc(doc(db, "familyMembers", id));

alert("Member deleted!");

location.reload();

}
</script>
</body>


</html>
