<!DOCTYPE html>
<html lang="en">

<head>
  <title>Sign Up</title>
</head>

<body>

<h1>Create Family Account</h1>

<input type="text" id="name" placeholder="Your Name">

<br><br>

<input type="email" id="email" placeholder="Your Email">

<br><br>

<input type="password" id="password" placeholder="Your Password">

<br><br>

<button id="signup-btn">
Create Account
</button>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword,
updateProfile

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDDqCkLKD_zwYD4ffhgTxk9qQtXTyUTSXE",

authDomain: "family-chat-4ae3c.firebaseapp.com",

projectId: "family-chat-4ae3c",

storageBucket: "family-chat-4ae3c.firebasestorage.app",

messagingSenderId: "757400177632",

appId: "1:757400177632:web:3b1743038b3c4a53c3985"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const signupBtn = document.getElementById("signup-btn");

signupBtn.addEventListener("click", async () => {

const name = document.getElementById("name").value;

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;

try {

const userCredential = await createUserWithEmailAndPassword(
auth,
email,
password
);

await updateProfile(userCredential.user, {

displayName: name

});

alert("Account created successfully!");

window.location.href = "login.html";

}

catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
