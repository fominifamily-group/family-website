<!DOCTYPE html>
<html lang="en">

<head>
  <title>Login</title>
</head>

<body>

<h1>Family Login</h1>

<input type="email" id="email" placeholder="Enter Email">

<br><br>

<input type="password" id="password" placeholder="Enter Password">

<br><br>

<button id="login-btn">
Login
</button>
<br><br>

<a href="signup.html">

<button>
Create Account
</button>

</a>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

apiKey: "AIzaSyDDqCkLKD_zwYD4ffhgTxk9qQtXTyUTSXE",

authDomain: "family-chat-4ae3c.firebaseapp.com",

projectId: "family-chat-4ae3c",

storageBucket: "family-chat-4ae3c.firebasestorage.app",

messagingSenderId: "757400177632",

appId: "1:757400177632:web:3b1743038b3c4a53c3985"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const loginBtn = document.getElementById("login-btn");

loginBtn.addEventListener("click", async () => {

const email = document.getElementById("email").value;

const password = document.getElementById("password").value;

try {

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("Login successful!");

window.location.href = "chat.html";

}

catch(error){

alert(error.message);

}

});

</script>

</body>

</html>
